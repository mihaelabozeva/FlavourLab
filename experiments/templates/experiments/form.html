{% extends "base.html" %}

{% block title %}Save Experiment | FlavorLab{% endblock %}

{% block content %}
<a class="back" href="{% url 'experiments:list' %}">Back to experiments</a>
<h1>{% if object %}Edit experiment{% else %}Add an experiment{% endif %}</h1>

<form method="post" class="form-card">
    {% csrf_token %}
    {% include 'partials/form_fields.html' %}
    <div class="actions">
        <button type="submit" class="btn">Save experiment</button>
        <a class="btn btn-ghost" href="{% url 'experiments:list' %}">Cancel</a>
    </div>
</form>
{% endblock %}

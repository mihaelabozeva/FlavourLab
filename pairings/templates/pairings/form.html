{% extends "base.html" %}

{% block title %}Save Pairing | FlavorLab{% endblock %}

{% block content %}
<a class="back" href="{% url 'pairings:list' %}">Back to pairings</a>
<h1>{% if object %}Edit pairing{% else %}Add a pairing{% endif %}</h1>

<form method="post" class="form-card">
    {% csrf_token %}
    {% include 'partials/form_fields.html' %}
    <div class="actions">
        <button type="submit" class="btn">Save pairing</button>
        <a class="btn btn-ghost" href="{% url 'pairings:list' %}">Cancel</a>
    </div>
</form>
{% endblock %}

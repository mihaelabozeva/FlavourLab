{% extends "base.html" %}

{% block title %}Save Pairing | FlavorLab{% endblock %}

{% block content %}
<h1>{% if object %}Edit Pairing{% else %}Add a Pairing{% endif %}</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save pairing</button>
</form>

<p><a href="{% url 'pairings:list' %}">Cancel</a></p>
{% endblock %}

{% extends "base.html" %}

{% block title %}Ingredients | FlavorLab{% endblock %}

{% block content %}
<div class="page-head">
    <h1>Ingredient library</h1>
</div>

{% if ingredients %}
<div class="grid">
    {% for ingredient in ingredients %}
        {% include 'ingredients/partials/card.html' %}
    {% endfor %}
</div>
{% else %}
<p class="empty">No ingredients yet.</p>
{% endif %}
{% endblock %}

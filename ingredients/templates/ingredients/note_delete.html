{% extends "base.html" %}

{% block title %}Delete {{ object.name }} | FlavorLab{% endblock %}

{% block content %}
<h1>Delete the note "{{ object.name }}"?</h1>
<p>It will be removed from every ingredient that uses it. The ingredients themselves stay.</p>

<form method="post" class="form-card">
    {% csrf_token %}
    <div class="actions">
        <button type="submit" class="btn btn-danger">Delete note</button>
        <a class="btn btn-ghost" href="{% url 'ingredients:note_list' %}">Keep it</a>
    </div>
</form>
{% endblock %}
